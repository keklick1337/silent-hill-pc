name: Build Android

# The Android APK for arm64-v8a, armeabi-v7a, x86_64 and x86 (docs/BUILDING.md
# section 5): each ABI is built on its own runner at the same time (libs), then one
# job packages them (apk). The game as libmain.so per ABI with the NDK, SDL3 and libjpeg-turbo
# built from the pinned sources (tools/android-deps/build.sh), the repository's
# base gamedata/ and the licenses, packaged by the Gradle project in android/
# (tools/android/build.sh). The APK is signed with the runner's debug key.
# release.yml calls this workflow on a v* tag and publishes the APK.
on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

concurrency:
  # Not github.workflow: inside release.yml the builds would share the caller's name.
  group: build-android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NDK_VERSION: '28.2.13676358'

jobs:
  libs:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm

      # The SDK's command line tools, then the pinned NDK.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: third_party/deps/src
          key: deps-src-android-${{ hashFiles('tools/win-deps/fetch.sh') }}

      # Rebuilt whenever the pinned list or the build script changes.
      - name: Cache Android dependencies
        uses: actions/cache@v4
        with:
          path: third_party/deps/android-${{ matrix.abi }}
          key: android-deps-${{ matrix.abi }}-${{ env.NDK_VERSION }}-${{ hashFiles('tools/win-deps/fetch.sh', 'tools/android-deps/build.sh', 'tools/opus/build.sh') }}

      - name: Build
        run: SH_ANDROID_STEP=libs JOBS="$(nproc)" tools/android/build.sh ${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-libs-${{ matrix.abi }}
          path: |
            android/app/build/sh/jniLibs/${{ matrix.abi }}
            android/app/build/sh/deps-licenses/${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 1

  apk:
    needs: libs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install the platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # Gradle itself, pinned; the Android Gradle Plugin is pinned in android/settings.gradle.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: third_party/deps/src
          key: deps-src-android-${{ hashFiles('tools/win-deps/fetch.sh') }}

      - uses: actions/download-artifact@v4
        with:
          pattern: android-libs-*
          path: android/app/build/sh
          merge-multiple: true

      - name: Package
        run: SH_ANDROID_STEP=package tools/android/build.sh

      - name: Version
        id: ver
        run: |
          v='${{ inputs.version }}'
          [ -n "$v" ] || v="$(git describe --tags --always --dirty)"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The universal APK holds every ABI's libraries, each ABI's APK its own; none holds anything imported from a
      # disc image in its base data.
      - name: Check the APKs
        run: |
          out=android/app/build/outputs/apk/debug
          v='${{ steps.ver.outputs.version }}'
          mkdir -p dist
          check() {  # <apk> <abi...>
            local apk="$1"; shift
            local list; list="$(unzip -l "$apk")"
            for abi in "$@"; do
              for lib in libmain.so libSDL3.so libc++_shared.so; do
                grep -q "lib/$abi/$lib" <<<"$list" || { echo "$apk: missing lib/$abi/$lib"; exit 1; }
              done
            done
            unzip -p "$apk" assets/base.zip > base.zip
            if unzip -l base.zip | grep -E ' gamedata/(raw|convert|tables)/|version\.cfg'; then
              echo "$apk: disc-derived files in the APK"; exit 1
            fi
          }
          check "$out/app-universal-debug.apk" arm64-v8a armeabi-v7a x86_64 x86
          cp "$out/app-universal-debug.apk" "dist/SilentHillPC-$v-android-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            check "$out/app-$abi-debug.apk" "$abi"
            cp "$out/app-$abi-debug.apk" "dist/SilentHillPC-$v-android-$abi.apk"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: SilentHillPC-android
          path: dist/*.apk
          if-no-files-found: error
