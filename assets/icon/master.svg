<?xml version="1.0" encoding="UTF-8"?>
<!-- The project's own application icon: the letters SH in fog, with a line of radio static.
     Drawn for this project (GPL-3.0-or-later, COPYRIGHT.md section 1); the letters are strokes, no font is needed.
     assets/icon/generate.sh renders it to master.png and the sizes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="back" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#4a545c"/>
      <stop offset="0.55" stop-color="#232a30"/>
      <stop offset="1" stop-color="#0d1013"/>
    </radialGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8d0d4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c8d0d4" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#c8d0d4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="shape">
      <rect width="512" height="512" rx="96" ry="96"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="512" height="512" fill="url(#back)"/>
    <!-- Fog banks behind the letters. -->
    <g filter="url(#soft)">
      <ellipse cx="150" cy="150" rx="260" ry="46" fill="#aab4ba" opacity="0.30"/>
      <ellipse cx="400" cy="250" rx="240" ry="40" fill="#aab4ba" opacity="0.22"/>
      <ellipse cx="120" cy="400" rx="280" ry="52" fill="#aab4ba" opacity="0.26"/>
    </g>
    <!-- S and H. -->
    <g fill="none" stroke="#e6e2d6" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 226 150 C 196 112, 96 116, 96 182 C 96 254, 230 236, 230 318 C 230 392, 122 396, 90 352"/>
      <path d="M 292 122 L 292 382 M 422 122 L 422 382 M 292 252 L 422 252"/>
    </g>
    <!-- Fog in front: the lower part of the letters sinks into it. -->
    <rect x="0" y="300" width="512" height="170" fill="url(#fog)"/>
    <!-- Radio static. -->
    <path d="M 40 452 l 22 0 l 8 -14 l 10 26 l 10 -34 l 10 40 l 10 -30 l 10 18 l 8 -6 l 24 0 l 8 -10 l 10 22 l 10 -40 l 10 46 l 10 -28 l 8 10 l 30 0 l 8 -12 l 10 24 l 10 -30 l 10 30 l 8 -12 l 26 0 l 8 -8 l 10 18 l 10 -22 l 10 18 l 8 -6 l 49 0"
          fill="none" stroke="#b8442c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
