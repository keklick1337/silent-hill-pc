# Silent Hill PC configuration
# Lines starting with # or ; are comments. The file is read when the game starts:
# an edit made by hand takes effect on the next start. The Options screens and
# the console change the same settings while the game runs and write them here.
# A key that is not set keeps its default; a "# key = value" line below shows the
# default of such a key. GAMEPLAY CHANGE marks every key that alters the rules,
# the balance or the story of the original game; those are off unless said.

# Graphics preset. Sets the default of every graphics key marked "(preset)"
# below; such a key written in this file overrides the preset for itself only.
# None of them changes game logic, timing, fog distance or what is drawn.
#   original = the console picture: native 320x224, PSX dither, point sampling,
#              the PSX per-vertex flashlight. Also the lightest on a weak PC.
#   enhanced = default. Window resolution, trilinear filtering, 4x MSAA,
#              per-pixel flashlight calibrated to the original, deband, soft
#              highlights. Fog and darkness as in the original, the fog's
#              steps smoothed (soft_fog).
#   high     = enhanced plus flashlight shadows, 8x anisotropic filtering and a
#              light film grain; with renderer = vulkan also the HDR frame
#              (soft tonemapper, bloom 0.3), TAA, ambient occlusion and the
#              map's lights.
#   ultra    = high with every quality key at its maximum: render_scale 2.0
#              (supersampling, capped at 5120x2880 pixels), 16x anisotropic,
#              8x MSAA, foliage_edge 2, flashlight shadows at 4096x4096 with the
#              5x5 filter; with renderer = vulkan also the sun's shadows,
#              volumetric fog with god rays and snow and ash shadows. The
#              look (fog, darkness, flashlight beam, grain) is the high one.
#              Needs a strong GPU.
#   ultra_upscaled = ultra plus the experimental upscalings: AI texture
#              upscaling x2 (texture_upscale = 2) and, with renderer = vulkan,
#              model upscaling (model_upscaling = tessellation).
#   ultra_rtx = ultra plus ray tracing with every ray-traced effect
#              (ray_tracing, rt_shadows, rt_reflections, rt_gi, rt_lights):
#              renderer = vulkan on a GPU that traces rays.
#   ultra_rtx_upscaled = ultra_rtx plus the same experimental upscalings as
#              ultra_upscaled. The two ultra_rtx presets are the only ones with
#              ray tracing.
#              Features the renderer or the GPU cannot run stay off; the
#              Options rows say why.
#   mobile   = phones and tablets (the default there): enhanced without MSAA,
#              the flashlight's shadow at a 512 map, render_scale from the
#              screen's height (half its lines). Offered in Options on
#              phones and tablets only. There the presets are their own set:
#              enhanced and high draw all of the screen's lines with every
#              light and shadow at a low quality (high adds ambient occlusion,
#              bloom and the volumetric fog), ultra adds TAA and god rays at
#              648 lines; at most trilinear filtering, no flake shadows, and
#              the upscaled and RTX presets, AI upscaling and ray tracing are
#              not offered (always off).
#   custom   = no preset: the built-in defaults plus the keys in this file.
# The table of values is in docs/RENDER.md (the section on state and
# presets).
# In-game: Options > Graphics > Quality Preset (Original / Enhanced / High /
# Ultra / Ultra+AI / Ultra RTX / Ultra RTX+AI, the RTX ones
# only where rays can be traced; "Custom" when a preset key below is set by
# hand). Choosing a preset
# there comments out the preset keys of this file so they follow the preset
# again, and sets Options > Lighting to Classic (original) or Modern (the rest).
# native_resolution changes on the next start; everything else at once.
# Left unset (as here) on a computer that renders on the CPU (see software_gl),
# the game starts with original (at the window's resolution) for that run; a
# graphics_preset line or a preset key written here is kept as it is.
# graphics_preset = enhanced

# (preset) Scene resolution relative to the window, 0.25..2.0. Below 1 renders
# fewer pixels and scales the picture up (weak PCs: 0.5); above 1 renders more
# and scales down (supersampling; the target is capped at 5120x2880 pixels and
# the GPU's texture limit). Ignored with native_resolution. Applies at once.
# Options > Graphics > Render Scale (50%..200%). ultra = 2.0, else 1.0.
# render_scale = 1.0

# Graphics backend: gl (OpenGL 3.3 core, the default), vulkan (the engine's own
# Vulkan 1.3 device) or sdlgpu (Vulkan through the SDL3 GPU device). Both Vulkan
# backends draw without MSAA; vulkan falls back to sdlgpu and then to gl, and
# sdlgpu to gl, when there is no Vulkan device or the build has no SPIR-V
# shaders. Any other name is replaced by gl. The command line argument
# -renderer <name> overrides the key for one run. Options > Graphics > Renderer
# saves it; it applies at the next start.
# renderer = gl

# Debugging: 1 = renderer = vulkan turns on the Khronos validation layer when it
# is installed (the Vulkan SDK or the system's package) and logs what it finds.
# Slow; without the layer the game starts as usual. Applies at the next start.
# vulkan_validation = 0

# renderer = vulkan: the graphics pipelines the game made in earlier runs are
# built at start, on worker threads, so none is compiled in the middle of play.
# Their compiled form is kept in gamedata/cache/pipelines/ and read again at the
# next start; after a game update or a driver change it is rebuilt once, with
# "Preparing shaders… N%" on the screen. 0 = no builds ahead (debugging: every
# pipeline is built on its first use, still from the cache on disk). Applies at
# the next start.
# shader_prewarm = 1

# Rendering on the CPU, for a computer without a usable GPU driver (slow, but
# the game runs). The OpenGL renderer then draws through Mesa llvmpipe: on
# Linux the system's Mesa, on Windows the copy in software_gl/ beside the exe.
# A Vulkan renderer skips CPU devices (lavapipe) and falls back to gl.
#   auto  = default. Windows loads software_gl/ only when the system's driver
#           has no OpenGL 3.3. A renderer that draws on the CPU starts with
#           graphics_preset original (at the window's resolution) for the
#           run, unless graphics_preset or a preset key is set in this file.
#   force = always draw on the CPU (testing; on Linux through Mesa only).
#   off   = never load software_gl/ and never change the graphics.
# Applies at the next start.
# software_gl = auto

# (preset) Ray tracing (renderer = vulkan only, a GPU with the standard KHR acceleration
# structure and ray query extensions): 1 = the scene's acceleration structures
# are built every frame, which the ray-traced effects below use. Without the
# native Vulkan backend or such a GPU nothing changes, and Options > Graphics
# shows the row unavailable with the reason. Off by default; applies at once.
# ray_tracing = 0

# (preset) Ray-traced flashlight shadows (needs ray_tracing = 1): shadow rays from each
# visible surface to points of the flashlight's lens, so the penumbra widens with
# the distance to the caster; cut-out holes let the light through and
# translucent surfaces tint it, as with the shadow map. Denoised by the game's
# own filter. Replaces the shadow map (shadows) where the rays reach; the shadow
# map stays the fallback everywhere else. 1 = on, 0 = off (default).
# rt_shadows = 0

# (preset) Ray-traced reflections (needs ray_tracing = 1): the water, and the surfaces
# gamedata/materials/ make reflective (wet floors of the sewers, the
# hospital's polished tiles), mirror what the flashlight and the map light show,
# blurred by the surface's roughness. A reflected ray never goes past the fog's
# opaque distance and is fogged along its own path, so nothing shows that the fog
# hides; a dark room stays dark. Additive and subtractive surfaces never reflect.
# 1 = on, 0 = off (default).
# rt_reflections = 0

# (preset) Ray-traced bounce light (needs ray_tracing = 1): one bounce of the flashlight,
# so a corridor lit by the beam gets a faint light of the colour of what the beam
# falls on. Rays stop at the fog's opaque distance; walls block the bounce. It is
# only ever added: a place no lit surface can see stays exactly as dark as in the
# original. 1 = on, 0 = off (default).
# rt_gi = 0

# (preset) Ray-traced map lights (needs ray_tracing = 1): the lamps, fires and glows that
# gamedata/maps/<map>/lights.json names, the match in Harry's hand, and on daytime
# maps the sun and the sky, with ray-traced shadows (light passes through the gaps
# of fences and leaves), their bounce (with rt_gi) and their light in reflections;
# glossy materials (gamedata/materials/) get a GGX highlight of them and of the
# flashlight. The fog dims every light and the sun, and the original's tint stays
# the floor: nothing is darker than without it. A map without the file looks as
# before. 1 = on, 0 = off (default).
# rt_lights = 0

# (preset) Extra lights, every renderer: lamps placed by hand where a room draws
# its fixtures lit (lights.json lights marked "extra", such as the lamps of the
# antique shop), switched on and off with the story's flags like the room
# itself ("when"). Shaded per pixel without shadows of their own, with the
# map's other lights when map_lights is on; with ray tracing and rt_lights they
# cast ray-traced shadows and bounce. The fog, the darkness and the flashlight
# stay as they are. On in the ultra presets. 1 = on, 0 = off (default).
# extra_lights = 0

# Rendering resolution: the window size in windowed mode (Options > Display >
# Aspect Ratio / Resolution). A window resized by hand is saved here too.
width = 1024
height = 768

# (preset) Native (PSX) resolution: 1 = render every screen at the resolution the game
# itself uses (320x224 in play, 640x448 on the Konami screens, 320x448 in the
# menus, changing whenever the original changes) and present it as a 4:3 image
# enlarged by the "scaling" key below; width and height then set only the
# window size. Widescreen is ignored. The menu panels keep the window resolution.
# No preset turns it on: original keeps the original look at the window's
# resolution and fills a wide window.
# native_resolution = 0

# Window mode: 0 = a window, 1 = exclusive fullscreen, 2 = borderless fullscreen.
fullscreen = 0

# Keep the mouse pointer inside the window while the game has the focus, in
# fullscreen and borderless only (1 = on, the default; 0 = off).
# confine_cursor = 1

# Vertical sync: 0 = off (no limit), 1 = on, -1 = adaptive.
vsync = 0

# Refresh rate asked of the display in exclusive fullscreen, in Hz (0 = keep the
# display's own). Pair it with vsync = 1 at your monitor's rate (60, 144, 240...).
refresh_rate = 0

# Frame limit of gameplay in frames per second: 0 = none, 60 = the default. The
# console drew at 30 (two vertical blanks a frame). The simulation steps by the
# time that really passed, so every limit keeps the same game speed. On a phone
# or tablet: 30, 60 or 120 (where the display can show 120); the display is
# asked to run at that rate and paces the frames itself (vsync is always on).
fps_cap = 60

# Frame rate counter: 0 = off (default), 1 = top left, 2 = top right,
# 3 = bottom left, 4 = bottom right. Console: fps 0..4.
# fps_profiler: 1 = the counter grows into the profiler overlay (frame time and
# 1% low, CPU, GPU, RAM, VRAM, draw calls). Console: profiler.
# Options > Interface > Performance Overlay sets both (Off, FPS, Profiler).
# fps_display = 0
# fps_profiler = 0

# perf_record: 1 = record a performance run from the start until the game quits:
# frame times, hitches and the GPU time of every render pass into
# perfrec/<date>.csv beside the game, for tools/scripts/perf_report.py.
# Console: perfrec start [name] | stop.
# perf_record = 0

# 1 = fps_cap also limits the screens outside gameplay: the main menu, the
# Options screens (on the title and in the pause menu), the map screens and the
# cursor puzzles. Nothing simulates behind them, so a higher rate cannot drift
# anything. The inventory always stays at 60, because its item carousel shares
# the timing of gameplay; cutscenes follow fps_cap like gameplay.
#
# 0 (default): on the console each of these screens advanced once per vertical
# blank, and their cursor speed and key repeat count frames, not time, so at
# 240 Hz they would run four times as fast. 1 trades that for smoother menus.
menu_fps_unlock = 0

# How the rain and snow are shown between their steps. The weather itself always
# steps 30 times a second, as on the console, at every frame rate: falling
# speed, wind, drift, how many flakes and drops spawn and how long they lie.
# 60 (default) also moves every flake and drop on its way on the frames
# between two steps, so the weather is smooth at 60 fps and above; 30 shows
# only the steps, the cadence of the console. Console: weatherhz 30|60.
weather_sim_hz = 60

# World draw culling (what is sent to the GPU).
#   modern   = default. Models are culled by the real field of view of the
#              window (any aspect ratio, ultrawide included) with a safety margin,
#              and by the fog distance. The baked per-subcell PVS of the console,
#              which popped fences and trees in and out on a PC camera, is not
#              used. Costs less than drawing everything.
#   original = the console's own PVS + frustum culling.
# Either way, the checks the game logic makes (enemy AI, events, sound: "is this
# on screen?") are the original ones, on the console's 4:3 screen, so behaviour
# does not depend on the window size. Change it live with the CULL console command.
# disable_culling (1 = modern, 0 = original) is an obsolete synonym; a culling line wins over it.
culling = modern

# How far the world is drawn, in percent of the original distance: 100
# (default) .. 200. Worth raising only together with a thinner fog, which
# otherwise hides the extra distance. Console: drawdist.
# draw_distance_pct = 100

# Density of the distance fog, 0.0 .. 2.0. 1.0 = default; 1.1 is the density of
# the console, at which Cheryl cannot be seen in the opening walk; lower thins
# the fog and shows more of the world. Console: fogstr.
# GAMEPLAY CHANGE below 1.0: outdoors the world is then visible past the
# distance at which enemies appear and disappear, so both happen outside the
# camera's view instead.
# fog_strength = 1.0

# (preset) Fog curve: 0 = the console's stepped fog, 1 = a smooth ramp with the
# same reach. original = 0, else 1 (custom: 0). Console: fogsoft.
# soft_fog = 1

# (preset) Ambient occlusion, renderer = vulkan only: 0 = off (default), 1 = soft shadow
# in corners and under objects. It darkens the map's own light, never what the
# flashlight lights, and never the fog in front of a surface. ao_strength 0.0 ..
# 1.0 (default 0.35) is how dark it gets.
# ambient_occlusion = 0
# ao_strength = 0.35

# (preset) Volumetric fog, renderer = vulkan only: 0 = off (default), 1 = the flashlight
# beam shows in the fog and is shadowed by what blocks it. The fog keeps the
# density of the soft fog ramp (soft_fog is used while it is on), so nothing is
# seen further than in the original. fog_scatter 0.0 .. 1.0 (default 0.25) is
# how much of the beam the fog scatters (0 = the soft fog image, unchanged);
# fog_anisotropy -0.9 .. 0.9 (default 0.2) how much of it goes on forward
# rather than back towards the camera.
# volumetric_fog = 0
# fog_scatter = 0.25
# fog_anisotropy = 0.2

# (preset) The map's lights without ray tracing, renderer = vulkan only: 0 = off
# (default), 1 = the lamps, the match of the opening alley and the overcast
# sun of the daytime maps (gamedata/maps/<map>/lights.json) light the scene as
# the ray tracer's rt_lights does, without shadows of their own; the original
# light stays the floor and the fog dims them as it dims everything. With
# ray_tracing and rt_lights on, the ray-traced light is used instead.
# sun_shadows (with map_lights): 0 = off (default), 1 = the sun casts soft
# shadows from a shadow map that ends where the fog does; the holes of fences
# and leaves let light through.
# god_rays (with volumetric_fog): 0 = off (default), 1 = the sun's light shows
# in the fog as shafts through trees, fences and windows. The fog keeps the
# original's density; the shafts only add light, and fade with the fog.
# particle_shadows: 0 = off (default), 1 = the falling snow and ash cast small
# soft shadows of the flashlight and (with map_lights) of the sun.
# map_lights = 0
# sun_shadows = 0
# god_rays = 0
# particle_shadows = 0

# (preset) Anti-aliasing and upscaling, renderer = vulkan only (not with msaa): 0 = off
# (default), 1 = TAA (temporal anti-aliasing: the world is drawn with a
# sub-pixel shift each frame and blended with the frames before along their
# motion), 2 = TAAU (the same, with the world drawn smaller and rebuilt at the
# full size), 3 = spatial (the world drawn smaller and scaled up in one frame,
# the cheap option). The HUD, menus and text are drawn after it at the full
# size. upscale_quality is the size the world is drawn at for 2 and 3: 0 =
# quality (2/3 per side, default), 1 = balanced (58 %), 2 = performance (1/2),
# 3 = ultra performance (1/3). upscale_sharpness 0.0 .. 1.0 (default 0.25)
# sharpens the result, held to its neighbours so the fog and the beam get no
# halo. temporal_debug = 1 shows the motion vectors instead of the picture.
# upscaler = 0
# upscale_quality = 0
# upscale_sharpness = 0.25
# temporal_debug = 0

# Frame pacing, renderer = vulkan only. present_mode: 0 = auto (default: FIFO
# with vsync, else immediate or mailbox), 1 = FIFO (waits for the display),
# 2 = mailbox (the newest frame, no tearing), 3 = immediate (may tear), 4 =
# FIFO relaxed (tears only when a frame is late); a mode the display lacks
# falls back to FIFO. frames_in_flight 1 .. 2 (default 2): frames the CPU may
# record ahead of the GPU; 1 lowers the delay. present_wait = 1 waits until the
# frame before is on screen before the next one starts (VK_KHR_present_wait
# with VK_KHR_present_id; ignored where the driver lacks them). A phone or
# tablet always presents FIFO.
# present_mode = 0
# frames_in_flight = 2
# present_wait = 0

# Whole town outdoors: 0 = off, 1 = on, 2 = auto (default): every loaded
# outdoor cell of the map is textured and drawn, not only the cells around
# Harry. auto turns it on only while fog_strength is below 1.0, the only time
# the far cells can be seen. Needs preload_chunks = 1 and resident_textures = 1.
# Console: wholemap.
# whole_map_exteriors = 2

# Texture pool of the map cells: 1 (default) = every material of the map keeps
# its own texture for as long as the map is loaded; 0 = the console's pool of
# ten texture pages, refilled as Harry moves (materials can lose their texture
# when more than ten pages are in view).
# resident_textures = 1

# 1 (default) = polygons whose screen box is larger than 1023x511 pixels are
# not drawn, as on the console: it removes the wedges that cross the screen
# when the camera sits inside geometry. 0 = draw them. Console: polysizecull.
# psx_poly_size_cull = 1

# 1 (default) = load every chunk (IPD) of a map when it starts; 0 = stream the
# chunks around the player as the console did (it kept two to four in memory,
# read from the disc). Loading them all removes the streaming pauses and keeps
# the whole map's geometry ready.
preload_chunks = 1

# First start. Without gamedata/version.cfg
# the game imports the disc image into gamedata/ before it starts. Paths that
# are not absolute are relative to the folder of the game.
#   gamedata_dir      where the imported data goes (default: gamedata)
#   import_image      the image (.cue/.bin, or a .zip holding them, read
#                     without unpacking); empty = look for one next to the
#                     game and in its data/ folder, or pass --image <path>
#   import_overwrite  1 = import again on every start, replacing gamedata/
#                     (--reimport does it once)
#   import_verify     1 = check CRC32 and the round trips after the import
#   import_threads    0 = one worker per hardware thread
#   import_textures = png, import_models = glb, import_audio = wav,
#   import_text = json (the game font; the English text is gamedata/text/en),
#   import_data = json (cutscenes, CMP, demos):
#   "none" leaves a group out
#   import_music = wav: the songs rendered to convert/audio/music/ for
#                     listening (the game does not read them: it plays the
#                     songs from their notes); opus = the same as Ogg Opus
#                     (128 kbit/s, about a tenth of the size); none saves
#                     about 460 MiB and is the default on Android.
#   import_tables = json: the only value
#   import_levels     unified = one file per map area in gamedata/maps/areas/
#                     (geometry, collision, map placements and the original
#                     map files); glb = also
#                     the per-cell views in convert/levels/; none = neither
# gamedata_dir = gamedata
# import_image =
# import_overwrite = 0
# import_verify = 1
# import_threads = 0
# import_textures = png
# import_models = glb
# import_audio = wav
# import_music = wav
# import_text = json
# import_data = json
# import_tables = json
# import_levels = unified

# A second mods folder, read after <exe>/mods (the
# section on where mods live): absolute, or relative to the folder of the game;
# ~ and %APPDATA% are not expanded. The player's load_order.json stays in
# <exe>/mods.
# mods_dir =

# Where the game reads the map files (BG/*.IPD cells, BG/*.PLM models) from.
#   unified = gamedata/maps/areas/*.glb (a mod's maps/areas/ first); written
#             from raw/ on the first start if missing (default)
#   legacy  = the game files (keep_raw below; a mod's BG/ first)
# Both give the same bytes: the game plays the same either way.
map_format = unified

# Where the game reads the animations (ANIM/*.ANM) from.
#   json = gamedata/convert/anim/ANIM/*.anim.json (a mod's convert/anim/ first);
#          written from raw/ on the first start if missing (default)
#   disc = the game files (keep_raw below; a mod's ANIM/ first)
# Both give the same bytes: the game plays the same either way.
anim_source = json

# The disc's files as they are (gamedata/raw/, about 580 MB). The import
# extracts them, converts them and then deletes raw/: the game reads the
# converted data and gamedata/convert/files/ (the few files no converter
# rebuilds byte for byte: models, sound banks, movies), with the same bytes.
# An older import loses raw/ once on the next start.
#   keep_raw  0 = delete raw/ (default); 1 = keep it, for debugging the
#             converters or converting again without the disc image
keep_raw = 0

# Quick setup: 1 = before the next start (and before the disc import on the
# first one) a window asks for the language, the renderer (OpenGL close to the
# original, or Vulkan with the enhanced features), the graphics preset and the
# display, with defaults detected from the graphics card, and writes them here
# with quick_setup = 0. The game first starts in a window on gl, as this file
# says; the quick setup's choices apply from the start that follows it. Also
# shown with the --setup command-line flag and from Options > Run Quick Setup
# (the game restarts into it). A missing config.cfg shows it too; a run driven
# by -consolecmd, --quit-after-import or without a display never stops for it.
quick_setup = 1

# Opening sequence:
#   0 = the warning screen, the logos and the opening movie, as in the original
#   1 = start at the main menu
#   2 = start playing at once: a New Game on Normal on the `map` key below,
#       without the opening movie (the -skiptogame command-line flag does the same)
# Options > Interface > Quick Start switches between 0 and 1.
skip_intros = 0

# Test option: easy, normal or hard forces that difficulty on every new game
# (the title's New Game, skip_intros = 2 and the console's map warp). Without
# the key (default) the choice made on the title screen decides, and
# skip_intros = 2 starts on NORMAL.
# new_game_difficulty = normal

# Where the saves are kept. Empty = the .savegames
# folder next to the game; a relative path is taken from the game's folder.
# There is no memory card: every save is a file (save_0001.sav, ...), as many
# as you like. Memory-card saves (gamedata/save/N.MCD, the card1/ card2/
# folders) and card images put in .savegames/import/ are imported once.
savegame_dir =

# Text language: the name of a language folder, gamedata/text/<code>/ or a mod's
# text/<code>/ (en, ru, de, fr, es, it, pl, pt, tr, ar, ja, zh, ko, ...). A folder
# is a language when it holds a lang.json. "auto" (the default) is English, the
# text of your disc.
#
# Letters come from the game font (the disc's letters plus the glyph sheets of
# gamedata/font); a letter it lacks is drawn from a mod's font, a font of
# gamedata/font or a font installed on this system.
#
# Also selectable in the title-screen Options "Language" row.
language = auto

# Which title screen is shown: auto (default, the one of your disc), us, pal or
# japanese. A style whose art the disc does not have falls back to the disc's
# own. Console: menustyle.
# menu_style = auto

# Sound: the engine's own sound system plays every effect, song and voice line from
# the converted data in gamedata/convert/audio; the console's
# sound chip is not emulated. The mix is stereo at 44.1 kHz.
#   audio_backend = auto | sdl | wasapi (wasapi: Windows only)
#   audio_mode = auto | shared | exclusive (exclusive: the WASAPI backend only)
#   audio_rate = auto | 44100 | 88200 | 176400 | 352800
#   audio_bit_perfect = 0 | 1: 1 = the output must take the mix unchanged; the
#                  sound does not start on a device that cannot
#   audio_output = auto | stereo | quad | 51 | 71 | hrtf: kept for the options
#                  menu; it has no effect on the stereo mix
# audio_backend = auto
# audio_mode = auto
# audio_rate = auto
# audio_bit_perfect = 0
# audio_output = auto

# Volume of the voice lines (0.0 .. 1.0, default 1.0; Options > Sound, console:
# xavolume) and of the movies' sound (0.0 .. 1.0, default 1.0).
# fmv_psx_volume: 1 (default) = the movies also play at the console's level,
# 80 of 128; 0 = at the level of their sound track.
# xa_volume = 1.0
# fmv_volume = 1.0
# fmv_psx_volume = 1

# Least silence between two voice lines of a cutscene, in milliseconds: the
# console's disc seek kept tightly timed lines apart. It never shortens a gap
# the cutscene has. 0 = off. Default 300.
# cutscene_line_gap_ms = 300

# A separate console window beside the game window (0 = hidden,
# 1 = visible). When on, the game's debug echo lines (e.g. [AIM-KF])
# also stream to that console in real time. The log file is written
# either way.
show_console = 0

# (preset) PSX ordered dithering (0 = off, 1 = on). The hardware's 4x4 dither plus a
# 5-bit colour reduction: the look of the console, which also turns the seams
# between texture pages into noise instead of hard lines. A key of its own, so it
# with a smoothing mode below. original = 1, else 0.
# dithering = 1

# (preset) Deband (0 = off, 1 = on). Part of Options > Lighting > Lighting. With dithering off, adds noise of under
# half an 8-bit step to the 3D picture, so fog and flashlight gradients do not
# break into bands. Invisible as noise; no effect while dithering is on.
# original = 0, else 1.
# deband = 1

# (preset) Texture filtering, separate from dithering:
#   0 = none        nearest texel, as on the console; page seams show
#   1 = bilinear    smoother and softer, no seams
#   2 = trilinear   bilinear between mipmap levels
#   3 = 2x anisotropic   4 = 4x   5 = 8x   6 = 16x
# original = 0, enhanced = 2, high = 5, ultra = 6. Also the in-game
# Options > Graphics > Texture Filtering row (the same Options screen on the title and in the pause menu),
# which cycle this and "dithering" together as one list.
#
# The samples stay inside the polygon's own region of the texture page, so no
# mode can blend in a neighbouring region across a seam (no light streak on a
# character's clothes, no edge of the next glyph beside a letter).
#
# Trilinear needs mipmaps, which only high-resolution replacement textures
# carry, so with the disc's own textures 2 looks the same as 1. The anisotropic
# modes do change the disc's textures: the shader takes their samples itself.
# texture_filter = 2

# (preset) AI texture upscaling, EXPERIMENTAL: the textures of the 3D world, the
# characters and the 2D pictures (title, menus, paper maps, examine and
# inventory pictures, save and loading screens, effects), upscaled by a neural
# network (Real-ESRGAN x4plus) on the graphics card through Vulkan compute, any
# vendor. 0 = off (the imported textures as they are), 2 or 4 = that many times
# larger (no side above 2048 texels: a larger picture gets the largest scale
# that fits; 8 and 16 of earlier versions are read as 4). The game starts the
# sh-upscale tool beside it in the background; it writes the pictures into
# gamedata/cache/upscale/<model>-x<scale>-v<n>/ on disk (its output in
# upscale.log there), and each texture changes in the running game as soon as
# its picture is written, those of the current map and characters first. Each
# scale has its own cache, so going back to one already made swaps at once. Only
# the textures of what is loaded are read into memory, as with the originals;
# upscaled ones get a mip chain. A pass takes minutes and runs slower while the
# game uses the graphics card heavily (docs/RENDER.md section 12);
# later starts only check the cache. Without a Vulkan device or the tool (a
# build without ncnn: tools/ncnn/build.sh) the original textures stay and
# Options says so. Cut-out edges stay hard and semi-transparent texels stay
# semi-transparent (the alpha is scaled without filtering); fonts, blend masks
# and 2D pictures that mix semi-transparent and solid colours are not upscaled.
# Pictures with lettering (signs, paper maps, notes, menus;
# gamedata/config/texture_upscale.json) keep their text: those parts are scaled
# with a plain filter instead of the network, which would paint over small
# letters. A texture a mod replaces is drawn as the mod made it and never
# upscaled. More than 2 is not recommended: 4 tends to look smeared. The
# ultra_upscaled and ultra_rtx_upscaled presets take 2. Also Options > Graphics > AI Texture Upscaling (under Models
# and Textures (experimental)), which shows the progress of a running pass.
# texture_upscale = 0

# 1 = smooth the 2D layer as well (menus, the paper map, the inventory and the
# other flat screens), not only the 3D world; 0 = keep it point-sampled. Kept
# apart from texture_filter, since the flat screens are a look of their own,
# chosen separately from the world.
menu_filter = 0

# brightness_level_bias: how the game's Brightness Level (0..7, the CLASSIC row
# of the Brightness screen, default 3, kept in the saves) becomes the grey that
# is added to the whole frame in the dark maps: (level - bias) * 8 + 4 of 255,
# nothing for a level below the bias.
#   0 = the console's mapping: level 3 adds 28. It is tuned for a TV, which
#       swallows the bottom of the signal; on a monitor it is a grey haze over
#       the darkness.
#   3 = default: level 3 adds 4, so black stays black, as the original looks on
#       its own display; levels 4..7 still brighten the dark (12..36).
brightness_level_bias = 3

# Image adjustments of the finished frame; 1.0 = unchanged (default).
#   brightness = 0.25 .. 2.0 (console: bright)
#   contrast = 0.5 .. 2.0
#   saturation = 0.0 .. 2.0 (0 = grey)
# The Brightness screen of the options sets them.
# brightness = 1.0
# contrast = 1.0
# saturation = 1.0

# What the brightness, contrast and saturation keys are allowed to touch
# (1 = only frames that render the 3D world, the default; 0 = the whole
# finished frame).
#
# The three adjust the finished image, so with 0 they also darken menus, the
# paper map, the save screen and every movie, seldom the aim of a brightness
# setting. With 1 frames without the world are left alone; the Brightness
# screen is always adjusted, or its own preview would not react.
#
# They still differ from the console's Brightness Level, which adds a lift per
# map effect: it raises the blacks only where a map requests it and leaves the
# daylight exteriors untouched. The CLASSIC row of the Brightness screen does that.
#
# The look filters (CRT, scanlines, vignette, grain, sharpen) and the tone map
# always cover the whole frame: they imitate a screen or a film and belong on
# all of it.
image_adjust_scope = 1

# (preset) How a render resolution SMALLER than the window is scaled up to fill it:
#   0 = integer         scale by a whole number only, centred inside a border;
#                       all pixels are equal, so nothing shimmers, but the
#                       screen is not filled.
#   1 = nearest         stretch to the window without blending; fills it, but
#                       pixels of unequal size make edges crawl.
#   2 = bilinear        stretch to fill, smoothly blended. Default.
#   3 = sharp bilinear  scale by a whole number, then blend only the rest:
#                       fills the window with crisp edges.
# Does nothing when the render resolution equals the window's, so it is
# mainly for native_resolution, render_scale below 1 and borderless at a
# deliberately low resolution. Every preset = 2.
# scaling = 2

# psx_dither is the obsolete combined key for dithering and texture_filter. A
# config that has it is converted to the two keys on load, keeping the look;
# there is no need to add it back.

# How the picture fills a display wider than 4:3 (16:9 and up).
# In-game: Options > Display > Widescreen (applies at once).
#   0 = Pillarbox  -   render 4:3 PSX content centered, black bars on sides.
#                    People, framing and field of view are exactly the console's.
#   1 = Hor+       -   default. Widen FOV horizontally so geometry beyond the
#                    edges of the console's frame comes into view (nothing is
#                    stretched, people keep their proportions). Fixed-cam
#                    shots use per-shot tuning (gamedata/config/camera.json,
#                    map_rules) to keep Harry framed like the original where
#                    it matters.
#   2 = Stretch    -   anamorphic stretch of 4:3 content to fill 16:9 (chars
#                    look about a third wider; kept for compatibility, not
#                    advised).
widescreen_mode = 1

# 2D screens (logos, title, menus, save/load, the Harry-running load screen, movies)
# on a widescreen window. Only has any effect on a window wider than 4:3; 3D
# gameplay uses widescreen_mode above.
#   1 = full width: pictures stay centred at their own aspect with black around
#       them, menu text, highlights and fades use the whole window (default)
#   0 = stretch the 4:3 art to fill the window
menu_pillarbox = 1

# Shape of the picture. The game renders 320x224 pixels that a television
# showed as 4:3.
#   display_aspect = crt (default): the frame is shown at 4:3 times
#                    crt_aspect_trim; raw: at the pixel shape of pixel_aspect
#   crt_aspect_trim = 0.5 .. 1.5, default 1.06: below 1.0 figures get taller
#                    and thinner. Console: crtaspect.
#   pixel_aspect = 0.5 .. 2.0, default 1.09375 (35/32): read only with
#                    display_aspect = raw. Console: par.
#   world_hscale, world_vscale = 0.25 .. 2.0, defaults 1.0 and 1.08: how much of
#                    the world is on screen across and down, as a fraction of
#                    the console's view. Console: hfov, vfov.
#   world_vshift = -60 .. 60, default 0: the view moved up by that many rows of
#                    the 224 in play. Console: vshift.
#   cutscene_vshift = -60 .. 60, default 0: the same in cutscenes. Console:
#                    cutshift.
# display_aspect = crt
# crt_aspect_trim = 1.06
# pixel_aspect = 1.09375
# world_hscale = 1.0
# world_vscale = 1.08
# world_vshift = 0
# cutscene_vshift = 0

# (preset) PGXP: sub-pixel-precision vertex coords + perspective-correct texture
# mapping. 0 = the PSX look: every vertex snaps to the 320x224 grid on its own,
# so model polygons jitter and textures swim on tilted faces. 1 = vertices keep
# full precision (enhanced/high). Console: PGXP 0|1.
# use_pgxp = 1

# (preset) Smooth models (needs use_pgxp = 1). 1 = character bones, held items
# and map models are drawn from full-precision copies of their transforms, so
# animated models do not twitch by fractions of a PSX pixel per bone (that is
# several pixels at 4K). Drawing only: logic and timing are unchanged. 0 = the
# PSX fixed-point steps. Console: SMOOTHMODELS 0|1.
# smooth_models = 1

# (preset) Edge of alpha-cut textures on the opaque primitives drawn over the
# scene (effects, 2D). 0 = the original cutout (any opaque texel keeps the pixel;
# edges are texel stair-steps). 1 = cut at the 0.33 contour of the filtered
# coverage. 2 = same, plus smoothed with MSAA sample coverage (needs msaa > 0,
# else acts as 1). Opaque filtered surfaces only; the map, its objects and the
# characters are drawn by the scene renderer, which has its own cutout.
# original = 0, ultra = 2, else 1.
# foliage_edge = 1

# (preset) Harry's trail on the loading screen (VISUAL DEVIATION outside
# "original"). original = the console's feedback: the last frame is copied back
# one 5-bit colour level darker every 2 vblanks, so every pose stays as a
# stair-step copy for up to a third of a second. smooth = a short smooth
# afterimage, gone in about 0.1 s whatever the frame rate. off = no trail.
# original = original, else smooth. Also Options > Graphics > Loading Trail.
# load_screen_trail = smooth

# Least time the loading screen with Harry running stays up, in seconds
# (0 .. 10). Without the key it is the min_vblanks of
# gamedata/config/map_load.json, 3 seconds. The load itself is never slowed:
# the new area waits behind the screen. 0 = no minimum. Console: loadmin.
# load_screen_min = 3.0

# The screen blur of the dream and Otherworld scenes (the previous frame mixed
# into the new one): 1 = on (default), 0 = off; the loading screen's trail is
# load_screen_trail above. Console: dreamblur.
# dream_blur_strength = 0.0 .. 1.0: how much of the previous frame stays;
# 1.0 (default) = as the console, lower fades the ghost image sooner.
# dream_blur = 1
# dream_blur_strength = 1.0

# (preset) Antialiasing (MSAA) on the 3D world. Smooths polygon edges; textures, dither
# and the 2D interface stay sharp. 0 = off, 2 / 4 / 8 = samples per pixel (more = smoother
# but costlier). The scene is drawn into a multisampled target and resolved before
# the post-process; the count is lowered to what the GPU takes (the log says
# "[GPU] MSAA: ..."), and the Vulkan renderer draws without it. Applies at
# once (Options > Graphics > Antialiasing). original = 0, ultra = 8, else 4.
# msaa = 4

# FXAA-style edge smoothing of the finished image (0 = off, 1 = on). A cheap
# luma-edge blur in the post pass; works together with or without msaa (it also
# softens alpha-tested foliage edges and texture shimmer MSAA cannot reach).
# Applies to the unfiltered image and to the "Off" post_process mode.
# fxaa = 0

# Widescreen (Hor+) edge fix (0 = off, 1 = on, default). The PSX rule that drops
# polygons wider than 1023 px is stretched by the aspect ratio, so large floor and
# building rectangles near the left/right corners stay drawn. No effect
# at 4:3 or in pillarbox/stretch modes. Related: psx_poly_size_cull = 0 disables
# the rule entirely.
# widescreen_edge_fix = 1

# (preset) Full-screen post-process look applied to the final image (Options > Graphics).
#   0 = none         5 = film grain
#   1 = CRT          6 = sharpen
#   2 = scanlines    7 = PSX retro (lower resolution and dither)
#   3 = vignette     8 = cinematic (colour grade, vignette and grain)
#   4 = colour grade
# high and ultra = 5 (with post_process_intensity 0.35), else 0.
# post_process = 0

# (preset) Tone mapping operator on the final image (Options > Graphics).
# Both Lighting styles (Options > Lighting) set it to 0.
#   0 = none   1 = Reinhard   2 = ACES   3 = filmic
# The frame is 8-bit, so these only reshape an already clipped image: Reinhard
# halves white, Filmic lifts the darkness. 0 in every preset; soft_highlights
# below handles the one place light goes past white.
# tonemap = 0

# (preset) HDR frame (renderer = vulkan only; GL and sdlgpu ignore these keys). 1 = the
# scene is drawn into a half-float target, so light past white (the per-pixel
# flashlight, additive effects) is kept instead of clipped, and the keys below
# take it back into the display's range. 0 in every preset. With
# hdr_tonemap = 0 and bloom = 0 the picture is the one of the 8-bit frame;
# menus and movies are never tonemapped. Applies at once (Options > Graphics).
# hdr_frame = 0

# (preset) Tonemapper of the HDR frame: 0 = clamp at white (as the 8-bit frame;
# soft_highlights still rolls the beam off), 1 = soft (soft_highlights as an
# operator of the whole frame: unchanged below 85 % white, a smooth shoulder
# above, so overlapping light keeps its colour), 2 = ACES filmic, 3 = Reinhard
# (white at 4x). 2 and 3 also darken the midtones a little.
# hdr_tonemap = 0

# (preset) Bloom of the HDR frame (0.0 .. 1.0, 0 = off): the share of the light above
# bloom_threshold that leaves its pixel and is spread around it (a dual-filter
# mip chain). It conserves energy, so only what passes the threshold moves and
# the fog and the darkness stay as they are; 0.3 is a faint glow round the beam.
# bloom_threshold (0.5 .. 4.0, default 1.0 = white) is the level above which
# light blooms.
# bloom = 0.0
# bloom_threshold = 1.0

# HDR10 output (0 = off, 1 = on; needs hdr_frame = 1): the swapchain in
# HDR10 / ST 2084 when VK_EXT_swapchain_colorspace and the display offer it,
# with VK_EXT_hdr_metadata where the driver has it; otherwise SDR as usual and
# Options > Graphics says why. hdr_paper_white is the brightness of SDR white
# in nits (80 .. 500, menus and the game's ordinary image), hdr_peak the
# brightest highlight the tonemapper sends (400 .. 10000 nits): set it to your
# display's peak.
# hdr_output = 0
# hdr_paper_white = 200
# hdr_peak = 1000

# (preset) Soft highlights (0 = off, 1 = on): where the per-pixel flashlight
# would push a surface past white it rolls off smoothly and keeps its colour
# instead of clipping to a flat white patch. original = 0, else 1.
# Part of Options > Lighting > Lighting.
# soft_highlights = 1

# (preset) Flashlight shadows (0 = off, 1 = on). 0 turns the shadow pass off
# whatever flashlight_mode says, so enhanced gets the per-pixel cone without
# the cost of the shadows. high and ultra = 1, else 0 (custom: 1, i.e. as the
# mode says). Without ray tracing the same map gives the match of the opening
# alley its shadow while the flashlight is off.
# (preset) shadow_resolution: the shadow map's side in texels, 256..8192
# (capped at the GPU's texture limit above 4096). ultra = 4096, else 1024.
# Options > Graphics > Flashlight and Lighting > Shadows: Off = shadows 0;
# Low / Medium / High / Ultra = shadows 1 with shadow_resolution 512 / 1024 /
# 2048 / 4096 (any other size shows "Custom").
# shadow_resolution = 1024
# shadows = 0

# (preset) Shadow edge filter (Options > Graphics > Flashlight and Lighting >
# Shadow Smoothing): how many shadow-map samples each lit pixel takes. The
# flashlight's shadows are soft: sharp where the caster touches the surface,
# wider the farther behind it they fall. More samples = a smoother penumbra.
#   0 = Low    6 + 8 samples, the grainiest, the cheapest (and 6 for the
#              sun's shadow map instead of 12)
#   1 = Medium 12 + 20 (default)
#   2 = High   16 + 32, the smoothest
# Only the edge quality changes: where the shadows fall and how dark they are
# stay the same. ultra = 2, else 1.
# shadow_filter = 1

# (preset) Water surface quality (the sewer water the flashlight shines on).
# Lower = visibly rougher and cheaper to draw.
#   auto   = from graphics_preset: original = low, enhanced = medium,
#            high and ultra = high (default)
#   low    = the console look: one wave set stepped on a coarse grid of
#            squares, a few brightness steps, 15 wave pictures a second, the
#            lamp's glow as a stepped blot; the characters are not mirrored
#   medium = smooth waves that bend the mirrored characters, 3 blur samples
#   high   = the same with a 5-sample blur of the mirror image
# What each level draws is the "quality" table of gamedata/effects/water.json.
# water_quality = auto

# (preset) Model upscaling, EXPERIMENTAL: rounder silhouettes of characters,
# enemies, world objects and the round things of the map (barrels, pipes,
# pillars, pots), cut finer the larger they are on screen (PN triangles; hard
# edges stay hard, flat walls and floors stay flat; UVs, colours and collision
# are untouched). Only with renderer = vulkan; other renderers draw the models
# as they are.
#   off          = the models as the game has them (default)
#   tessellation = through the GPU's tessellation stages
#   mesh_shaders = the same shape through task and mesh shaders
#                  (VK_EXT_mesh_shader); without them, tessellation
# The ultra_upscaled and ultra_rtx_upscaled presets take tessellation. A model, object or map file a mod
# supplies is drawn as the mod made it and never upscaled. Options > Graphics >
# Model Upscaling (under Models and Textures (experimental)); console:
# modelupscale 0|1|2.
# model_upscaling = off

# The Options > Lighting page (also Options > Graphics > Flashlight and
# Lighting) holds the flashlight: Flashlight, Shadows, Shadow Smoothing, Beam
# Brightness (flashlight_intensity), Beam Size (flashlight_size) and Lighting.
# The Flashlight and Lighting rows each set a group of keys. A row shows
# "Custom" when the keys were changed by hand; choosing a style there writes
# them all.
#   Flashlight  Classic: flashlight_mode 0 (the original per-vertex beam).
#               Modern:  flashlight_mode 1 (the per-pixel cone calibrated to the
#                        original), flashlight_intensity 1.20, flashlight_size
#                        3.00, flashlight_intensity_fps 2.10, flashlight_size_fps
#                        1.30. Its shadows are the Shadows row.
#   Lighting    Classic: soft_highlights 0, deband 0, tonemap 0, hero_light 0.
#               Modern:  soft_highlights 1, deband 1, tonemap 0, hero_light 2.
# The defaults (graphics_preset = enhanced) are Modern / Modern.
#
# Soft fill light on Harry in the dark: 0 = off, 1 = low, 2 = medium (default),
# 3 = high. Part of Lighting. hero_light_flashlight = 1 keeps it on while the
# flashlight is on.
# hero_light = 2

# (preset) Flashlight mode: the Options > Lighting > Flashlight row (0 / 1)
# or console `flmode`.
#   0 = Classic           the console's flashlight, lit per vertex.
#   1 = Classic + Shadows lit per pixel, tuned to look like the original, with
#                         shadows cast in real time.
#   2 = Modern            a stylised per-pixel spotlight (dark surroundings,
#                         shaded surfaces), no shadows.
#   3 = Modern + Shadows  the Modern spotlight with real-time shadows.
# Shadows of modes 1 and 3, console: `shadowstrength <f>` (1 = full, the default;
# less = lighter), `shadowfade <f>` (0 = off; above 0 a prop's shadow fades out
# over that many units behind it), `shadownormal <f>`, `shadowbias <f>`.
# original = 0, else 1 (with "shadows" deciding the shadows).
# flashlight_mode = 1

# Strength of the effects. The console sets them too (flintensity,
# postintensity, tmintensity), and a change made in the game is written back here.
#   flashlight_intensity   : per-pixel flashlight cone brightness scale (0..3;
#                            the Beam Brightness row steps 0.50..3.00).
#                            Each flashlight style has a tuned default of its own
#                            (Modern 2.10, Classic + Shadows 1.20) and a style
#                            change switches to it unless you set your own value.
#   flashlight_size        : how much of the view the per-pixel cone covers (0..3;
#                            per-style defaults: Modern 2.40, Classic+Shadows 3.00;
#                            the Beam Size row steps 0.50..3.00)
#   flashlight_*_fps       : the brightness and size of the light in first-person
#                            view (a head lamp: narrower, as bright)
#   post_process_intensity : post-process effect mix (0..1, 1 = full effect;
#                            preset: high = 0.35, else 1.0)
#   tonemap_intensity      : how much of the tone map is applied (0..1, 1 = all)
flashlight_intensity = 1.20
flashlight_size = 3.00
flashlight_intensity_fps = 2.10
flashlight_size_fps = 1.30
# post_process_intensity = 1.0
tonemap_intensity = 1.0

# 1 = an idle title screen plays the demos recorded on the disc, with the
# opening movie every third round, as the original does; any button returns to
# the title. A demo is replayed pad input and keeps in step only with the original
# camera and movement -- the game forces those for the demo's duration.
attract_demos = 1

# (preset) Bullet holes: a shot of the player that strikes world geometry leaves
# a bullet hole at the impact point (up to 64 at once, cleared on map load). The
# holes are generated by the engine: every hit gets its own shape, size and turn,
# the flashlight lights its relief, and walls, fog and darkness hide it like the
# surface it sits on. Drawing only: the game state does not change.
# original = 0, enhanced and above = 1.
# bullet_decals = 1

# Not in the original, off by default: 1 = a red glow pulses at the edges of
# the screen while Harry's health is low.
# low_health_glow = 0

# Added voices for text boxes the game never voiced (a mod's XA/msg_<KEY>.wav
# or .opus, recorded by the mod's author), in milliseconds:
# msg_voice_lead_ms: how long the page shows before its clip starts. Default 500.
# msg_voice_tail_ms: how long the page stays once the clip has ended. Default 500.
#
# Such pages have a timer written for a line no one speaks,
# which is routinely shorter than a recording of it, so the timer alone would
# advance the text and cut the clip off mid-word. The page waits for the lead,
# the clip and then the tail; its own timer only keeps it longer. 0 = no lead,
# or wait for the clip only.
#
# Only the automatic page turn waits: the button still skips the line at once.
# A page without a file of its own, covered by a recording that spans several
# pages, keeps the original timing.
msg_voice_lead_ms = 500
msg_voice_tail_ms = 500

# Log (terminal, logs/silenthill-<time>.log next to the exe, in-game console).
# Levels: off, error, warn, info, debug, trace. Categories: game, fs, cd,
# texture, model, anim, spawn, event, map, fmv, audio, input, render, save,
# import, config, console. Console: `log list`, `log texture trace`.
# log_level: level of every category not named in log_categories.
# log_categories: per-category levels, e.g. texture=trace,spawn=debug,*=info
# log_file: 1 = write the log file (the newest 10 are kept).
# Optional:
#   log_file_level = <level>     the file also takes every line up to this level
#   log_console_level = <level>  the most the in-game console shows (default info)
#   log_terminal = 0 | 1         lines on the terminal (default 1)
#   log_color = auto | 0 | 1     colours on the terminal (default auto)
log_level = info
log_categories =
log_file = 0

# Debug switch, not a gameplay change. 1 = a map logs what it draws of its world
# objects (gamedata/maps/<map>/world_objects.json) as [WOSHADOW] summaries: every
# 600 frames, on a map change and at exit.
world_objects_shadow = 0

# Loading speed. Loads are instant by default on modern storage.
# cd_fast_load: 1 = blocking loads (doors, map changes, loading screens) do not
#   wait a VBlank per queue step (default); 0 = PS1 pacing. Console: FASTLOAD 0/1.
# cd_speed_ps1: 1 = every CD read at the PS1 2x drive pace (slow, for timing
#   comparisons); 0 = instant reads (default).
cd_fast_load = 1
cd_speed_ps1 = 0

#============================================================================
# CONTROLS
#============================================================================
# Keyboard and controller are independent: both are always active and can be
# bound separately. (Edit in Options > Controls > Key Bindings, or by hand here.)

# Debug options (0 = hidden, default; 1 = shown): the DEBUG OPTIONS entry of the
# pause menu and the F10 key that opens the same debug menu. In-game: Options >
# Interface > Debug Options. The console's `debugmenu` opens it either way.
# debug_options = 0

# Enable developer keys: Num * free camera, Num . position log, Num 3 fall
# rescue, the keyframe viewer keys and the console's key binds (`bind`).
# 1 = on, 0 = off (the default).
allow_debug_controls = 0

# Built-in modding tools: F2 or the console's `editor`
# opens the editor in free gameplay -- the game is held, a free camera flies,
# panels show the viewer options (fog off, full bright, wireframe, collision
# view), maps and warps, and the coordinates of a clicked world point with Lua
# and JSON snippets to copy. Leaving restores the game exactly.
# Options > Interface > Modding Tools (F2).
# 1 = on, 0 = off (the default).
modding_tools = 0
# The editor's viewer options are written here only by its "Save viewer
# settings" button, and the size of its interface when it is changed there:
#   editor_fog_off = 0 | 1           editor_full_bright = 0 | 1
#   editor_light_scale = <number>    editor_flashlight_off = 0 | 1
#   editor_brightness = <number>     editor_contrast = <number>
#   editor_wireframe = 0 | 1         editor_collision_view = 0 | 1
#   editor_ui_scale = <number>

# In-game console on key_console: 1 = on (default), 0 = off. The cheat and
# debug keys above stay under allow_debug_controls.
console_enabled = 1

# What moves Harry on a controller: analog (left stick), dpad, or both (default).
controller_movement = both
# 1 = the d-pad does not move Harry in play, so its four directions are free
# for other binds; 0 = default.
# disable_dpad_movement = 0
# Which pictures the button prompts use: 0 = auto (default, by the connected
# controller), 1 = PlayStation classic, 2 = PlayStation, 3 = Xbox, 4 = Nintendo,
# 5 = Steam. Options > Controls.
# gamepad_icons = 0

# 1 = the movement state machine of the original (speeding up, wall bumps, authored
# sidesteps/stumbles, analog pressure walking) - the default. 0 = the simplified
# PC movement (kept for the debug TPS camera and as a fallback).
movement_original = 1

# Keyboard and mouse bind to ACTIONS, not to PS1
# buttons: action_<name> = <key>[,<key2>] -- a primary and an optional
# secondary key. Values are SDL key names (Space, Return, Escape, Tab, Up,
# "Left Shift", "Left Ctrl", Keypad 0 ...), Mouse1..Mouse5, MouseWheelUp /
# MouseWheelDown, or NONE. A line that is not here keeps the built-in default;
# Options > Controls > Key Bindings rebinds them in game and writes these lines.
# Two schemes: these names apply with the classic camera; the same names with
# an "_altcam" suffix apply with the alternate cameras (TPS/OTS/FPS). Quick
# save/load/options and swap shoulder have one value for both.
#
# Defaults (classic):
#   action_move_forward = Up,W          action_move_back = Down,S
#   action_turn_left = Left,A           action_turn_right = Right,D
#   action_step_left = Q                action_step_right = E
#   action_run = Left Shift,Right Shift action_interact = Space
#   action_attack = Mouse1              action_aim = Mouse2,Left Ctrl
#   action_view = V                     action_back = Escape,Backspace
#   action_confirm = Return,Keypad Enter
#   action_inventory = Tab,I            action_map = M
#   action_pause = Pause                action_flashlight = F
#   action_reload = R                   action_change_camera = F9
#   action_quick_turn / action_rear_look / action_cycle_weapons /
#   action_quick_heal = NONE
#   action_quick_save = F6  action_quick_load = F8  action_debug_menu = F10 (DEBUG OPTIONS menu)
#   action_swap_shoulder = Mouse3
# Alternate cameras differ: move_forward = W,Up  move_back = S,Down
#   turn_left = Left  turn_right = Right  step_left = A,Q  step_right = D,E
#   view = NONE.
# Back is "pause" in free gameplay and "cancel / previous screen" everywhere
# else; Confirm skips cutscenes and confirms in menus. PS1-button keys
# (key_cross, key_up_2, ... and their _altcam twins) found in a config are
# converted to actions once on load and not used after it.

# --- Controller buttons (CLASSIC, the default camera) ---
# A value is an SDL gamepad button name: a b x y leftshoulder rightshoulder
# lefttrigger righttrigger leftstick rightstick start back guide, or NONE for no
# button. The d-pad and the sticks move Harry and cannot be rebound.
pad_cross = a
pad_circle = b
pad_triangle = y
pad_square = x
pad_l1 = leftshoulder
pad_r1 = rightshoulder
pad_l2 = lefttrigger
pad_r2 = righttrigger
pad_l3 = leftstick
pad_r3 = rightstick
pad_start = start
pad_select = back
# Classic controller ALTERNATES default unbound: pad_cross_2 ... pad_select_2.
# Controller buttons of the added actions, per scheme like the buttons above
# (the alternate cameras: the same key with "_altcam"):
#   pad_reload = rightshoulder        pad_quick_turn = leftshoulder
#   pad_cycle_weapons = NONE          pad_quick_heal = NONE
#   pad_rear_look = NONE (held; alternate cameras only)
#   pad_flashlight = NONE

# --- Hotkeys that work in every camera mode ---
# Quick save/load, change camera and swap shoulder are actions (above).
pad_change_cam = rightstick
# Controller buttons for Quick Save / Quick Load (as the F6 / F8 keys), unbound by default.
pad_quicksave = NONE
pad_quickload = NONE
# Controller buttons for the DEBUG OPTIONS menu (as F10) and for Swap Shoulder
# (as Mouse3), unbound by default.
# pad_debug_menu = NONE
# pad_swap_shoulder = NONE
# Console text size: 0 = from the window height (480p 1x, 1080p 3x, 4K 5x),
# 1..8 = fixed. Console: conscale.
console_scale = 0

# Console font file (TrueType); empty = a system monospace font, then the bundled JetBrains Mono.
# With console_scale = 0 the size follows the window height; N > 0 sets the em height to N*8 pixels.
console_font =
# Dev console toggle key (keyboard only). Default tilde "`"; rebind if your
# keyboard layout can't reach it. Press to open/close the console (game pauses);
# `help` lists the commands, Tab completes, Up/Down recall, PgUp/PgDn scroll.
key_console = `
# Key that leaves the game: on the title screen it quits, in play it returns
# to the title. Unbound by default (the pause menu has EXIT).
# key_exit_game = NONE

#============================================================================
# Other control styles (cameras)
#============================================================================
# Active camera/control style: classic (the original camera and controls), tps
# (third person: the camera follows behind Harry, he turns toward it smoothly) or
# fps (first person). Options > Camera > Camera and F9 in game step through these
# three; `ots` (third person held over one shoulder) can only be set here.
control_style = classic
# Written by the game at every start (id:Label|...); changing it does nothing.
control_styles = classic:Classic (Default)|tps:Thirdperson Shooter|fps:First Person
# Invert vertical look in the Thirdperson and Over-the-Shoulder cameras.
invert_mouse_y = 0
invert_controller_y = 0
# Quick weapon keys (1 = on): the number keys 1..0 and - select the knife, pipe,
# handgun, shotgun, hunting rifle, hammer, axe, chainsaw, katana, drill and hyper
# blaster, and the mouse wheel cycles the weapons in the inventory. Off by default.
# Options > Controls > Quick Weapon Switch.
quick_weapon_switch = 0
# Horizontal field of view in degrees (on a 4:3 basis) of the Thirdperson and
# Over-the-Shoulder cameras, 55..110. The fixed Classic cameras always use the
# game's projection. 71.1 is that projection's angle (the 320x224 frame at H=224),
# so the default looks the same as the original.
tps_fov = 71.1
# The same for Over-the-Shoulder (40 .. 140 is accepted for the three FOV keys).
# ots_fov = 71.1
# "TPS/OTS Aim Zoom": how much the camera closes in behind Harry while he aims,
# in percent of the zoom range: 100 (default) = the full zoom of the original,
# 200 = twice as deep, 0 = none.
# (The obsolete on/off key tps_aim_zoom is read as 0 or 100 of this one.)
tps_aim_zoom_amount = 100
# The same for Over-the-Shoulder. Both take -200 .. 200: a negative value pulls
# the camera back while aiming.
# ots_aim_zoom_amount = 100
# How close the camera rests behind Harry when he is not aiming, on the same
# scale (-200 .. 200): 0 (default) = the original distance, higher = closer.
# tps_rest_zoom_amount = 0
# ots_rest_zoom_amount = 0
# Where the camera sits across and up from its centred place, in 1/4096 of a
# metre (-20000 .. 20000): x = to the right (Swap Shoulder mirrors it), y = down
# (negative = up). "rest" applies while not aiming, "aim" while aiming; the
# Thirdperson aim offset only with tps_ots_aim = 1.
# Thirdperson rests over Harry's right shoulder: 0.4 m to the side and 0.1 m up
# (1638, -410), so he stands left of the middle and the middle of the picture,
# where he aims, is clear. 0 and 0 put the camera straight behind him. Swap
# Shoulder (action_swap_shoulder, pad_swap_shoulder) moves it to the other side.
# tps_rest_x = 1638
# tps_rest_y = -410
# tps_aim_x = 3686
# tps_aim_y = 0
# ots_rest_x = 2252
# ots_rest_y = 0
# ots_aim_x = 3686
# ots_aim_y = 0
# "OTS aiming in Thirdperson": aiming in Thirdperson moves the camera smoothly
# into the Over-the-Shoulder framing, and the swap-shoulder button works while
# aiming (1 = on, the default); 0 = the camera keeps its resting place while
# aiming.
tps_ots_aim = 1
# "Allow thirdperson camera collision": bring the TPS/OTS camera closer when the
# level would get between it and Harry (1 = on, the default); 0 = it keeps its
# distance and may go through walls.
# Options > Camera > Camera Collision.
tps_camera_collision = 1
# TPS/OTS spring arm (the engineering numbers - follow and zoom times, the lag
# limit, the wall probe, the stick curve - are in gamedata/config/alt_cameras.json,
# "spring_arm" and "look"; mods can patch that file). All of these follow the
# frame time, so the camera feels the same at any frame rate.
# How softly the camera follows Harry, 0..100 (%). 0 = rigid (glued to him),
# 50 = the default light lag, 100 = the softest. Aiming always follows tighter.
# Options > Camera > Camera Smoothing.
tps_camera_smoothing = 50
# Mouse and right stick look smoothing, 0..100 (%). 0 = raw input (the default);
# higher spreads each turn over the next frames without losing any of it.
# Options > Camera > Look Smoothing.
tps_look_smoothing = 0
# Auto-level: while Harry moves and the view has not been turned for
# tps_recenter_delay seconds, the camera pitch eases back to level behind him
# (1 = on, the default). Harry steers by the camera, so the yaw is already
# behind him. Options > Camera > Auto-Level Camera.
tps_camera_recenter = 1
# Seconds without mouse or right stick look before the auto-level starts, 0..30.
tps_recenter_delay = 2.0
# A crosshair in the middle of the screen while aiming in TPS/OTS (1 = on).
crosshair = 0
# Shape of the crosshair (with crosshair = 1):
#   0 = plus (+)   1 = dot   2 = ring   3 = dashes with a gap
# Options > Interface > Crosshair Style has a row for it.
crosshair_style = 0
# Crosshair size in percent, 25 .. 125 (default 100). Console: crosshairsize.
# crosshair_size = 100
# Aim assist of the free aim in the alternate cameras, which the original does
# not have: 1 (default) = a shot aimed with the mouse takes an enemy by its
# whole body and a controller's aim finds an enemy by itself; 0 = off. The
# classic camera aims as the original does.
# aim_assist = 1
# First person: show the crosshair only while the weapon is raised, as in the
# Thirdperson and Over-the-Shoulder cameras (1 = on). 0 (default) = always shown
# in first person. Needs crosshair = 1.
crosshair_fps_aim_only = 0
# No crosshair while a melee weapon, or none, is in hand, in every
# camera (1 = on); guns keep it. Config-only.
crosshair_hide_melee = 0
# Reloading:
#   0 = only the reload button reloads (a touch screen, which lacks one, still
#       reloads after firing an empty gun)
#   1 = firing an empty gun reloads it, with the animation, in every
#       camera (GAMEPLAY CHANGE)
#   2 = the original game (the default): as 1, and the clip also fills from
#       the reserve the moment the gun is raised, with no animation
# 0 is a GAMEPLAY CHANGE too. Options > Gameplay > Auto Reload has a row for it.
auto_reload = 2
# GAMEPLAY CHANGE, on by default (0 = the original game). 1 = when the inventory
# closes with the same weapon still aimed, pressing aim within a second brings
# the weapon straight back to the held pose, so a quick shot fires at once.
# 0 = as the original: the raise plays again from its start and a fire press
# is ignored until it ends. Options > Gameplay > Quick Aim After Inventory.
aim_resume_after_inventory = 1
# GAMEPLAY CHANGE, off by default (0 = the original game). 1 = the pause screen
# is a menu (CONTINUE, SAVE, LOAD, OPTION, EXIT) and the clear-time
# clock, which the ending results show, stands still while paused. 0 = the
# original: a blinking PAUSED, the clock keeps running, the pause button resumes.
pause_menu = 0
# Back (Escape) in free gameplay opens the pause menu (CONTINUE,
# SAVE, LOAD, OPTION, EXIT); OPTION is the same options screen as the title's.
# Not a gameplay change: the clear-time clock keeps running and SAVE works only
# at notebooks unless save_anywhere = 1. The Pause key and the controller's
# Start keep the original blinking PAUSED. 0 = Back pauses like Start.
pause_menu_on_back = 1
# GAMEPLAY CHANGE, off by default (0 = the original game: you save at a
# notebook). 1 = the quick save key (key_quicksave, F6) opens the save screen
# anywhere in gameplay. The quick load key (F8) opens the load screen either way.
save_anywhere = 0
# GAMEPLAY CHANGE, off by default (0 = the original game). 1 = the quick save
# key (key_quicksave F6, pad_quicksave) saves at once, with no screen, to the
# quick slot (.savegames/quick/quick_01.sav), and the quick load key (F8,
# pad_quickload) loads that save at once. Saving works in free gameplay only:
# not in menus, cutscenes or map events, during a boss fight, between rooms or
# while dying. A quick save counts as a save on the results screen. Also
# Options > Gameplay > Instant Quick Save; the keys are the row below it
# (Quick Save Keys) and the Controls screen. 0 = F6 / F8 open the screens.
quick_save_instant = 0
# GAMEPLAY CHANGE, off by default (0 = the original game: a dead enemy's body
# disappears once you walk away or leave the room, and its blood pool with it).
# 1 = bodies and the blood pools under them stay for good where the enemies
# died: remembered per map and room, put back when you come back, and written
# into your saves (saves made without it load as before). A body that stayed is
# scenery: it blocks nothing and cannot be hit or attack.
# Options > Gameplay > Bodies Stay.
persistent_remains = 0
# GAMEPLAY CHANGE, off by default (0 = the original game). 1 = the options
# screen's Weapon Control is pinned to hold-to-aim every frame, so choosing
# Switch (toggle-to-aim) there, or loading a save made with it, has no effect.
# 0 = the option decides, as in the original.
force_hold_aim = 0
# GAMEPLAY CHANGE, off by default (0 = the original game). 1 = the player's
# bullets test an enemy hitbox inflated to the visible body (twice the
# collision radius up and down, once wider), in every camera including Classic,
# and the free-aim assist aims into that span. 0 = the original narrow band
# from the neck to the chest.
bullet_fat_hitbox = 0
# GAMEPLAY CHANGE, off by default (0 = the original game). 1 = the "no enemies
# spawn" flag that the streets (map2_s00) and the Cybil carousel approach
# (map6_s04) set until a story event clears it is cleared on entering any
# other map except the opening cafe maps, so enemies spawn there whatever the
# story progress. Meant for starting on a late map through the `map` key.
force_enemy_spawn = 0
# GAMEPLAY CHANGE, off by default (0 = the original game). 1 = a Puppet Nurse
# or Doctor holding Harry takes the damage of its swing every 1.5 s. In the
# original the hold reads the grab's own attack row, whose damage is 0, so it
# never takes health (Harry only loses time).
fix_nurse_grab_drain = 0
# GAMEPLAY CHANGE, off by default (0 = the original game). 1 = a melee swing
# hits a target only once, and a blade (knife, pipe, katana, the nurses'
# knives) deals the damage of its whole swing on that hit wherever in the swing
# it lands. 0 = as the original: a blade adds the part of the swing it sweeps on
# every frame it touches the target, so a hit late in the swing deals less.
melee_once_per_swing = 0
# GAMEPLAY CHANGE, off by default (0 = the original game). 1 = a rising slope
# steeper than about 37 degrees does not slow Harry down, which removes the
# invisible walls on steep ground.
slope_fix = 0
# GAMEPLAY CHANGE, off by default (0 = the original game). 1 = how far the move
# stick is pushed is its radius, so a diagonal push walks and runs as fast as a
# straight one. 0 = the vertical axis only, as the original.
stick_radius = 0
# Not in the original, off by default. 1 = in interiors a pickup is also drawn
# from the neighbouring cell (and through a wall); picking it up is unchanged.
near_pickup_draw = 0
# 1 = the mouse moves the pointer of the cursor puzzles and of the inventory
# and clicks the entries of the main menu (default); 0 = keys and pad only.
# mouse_cursor = 1
# Script debugging (not a gameplay option). 1 = map scripts and mods also get the
# low-level raw bridge (sh.call, sh.ovl_get/ovl_set, sh.chara_get/chara_set,
# sh.sys_get/sys_set, ...): engine functions and map memory by their internal
# names. The shipped scripts use only the named API. 0 = hidden.
script_raw_api = 0
# Text size of subtitles, memos and other messages of the game, in percent (100 .. 150).
# Menus stay at their original size. A message that would not fit on screen at
# this size is drawn as large as fits. Options > Interface > Text Size, or
# console command textsize.
text_size = 100
# EXPERIMENT: in first person the view also follows the animated turn of Harry's
# head bone (idle sway, leaning), with the mouse added on top (1 = on).
immersive_fps_head_tracking = 0
# On-screen controls of a touch screen (phones and tablets; README, "Touch
# controls"): a stick, the action button, aim and attack, map, inventory, pause.
# auto (default) = on a touch screen, hidden while a controller is in use;
# on = always, also on a desktop, where the mouse is the finger (for testing);
# off = never (the screen still works as a pointer in the menus).
# Options > Controls > Touch Controls.
# touch_controls = auto
# 0 (default) = the action button shows only when something in reach answers
# it (an item, a door, a note); 1 = always.
# touch_action_button = 0
# 1 (default) = a tap of the aim button raises the weapon and the next tap
# lowers it; 0 = hold it to aim.
# touch_aim_toggle = 1
# 1 (default) = the stick pushed most of the way forward (straight or diagonal)
# runs, as the run button; Harry keeps running while he turns.
# touch_stick_run = 1
# How Harry is moved: stick (default) = the floating stick in the left part of
# the screen; dpad = a fixed cross of four arrows held with one finger (a
# diagonal presses two), the pad's digital d-pad as in the original, with a Run
# button that a tap turns on and the next tap off (not kept between sessions).
# Options > Controls > Movement (on a phone).
# touch_movement = stick
# Opacity of the controls (0.2 .. 1.0) and their size (0.6 .. 1.6).
# touch_opacity = 0.6
# touch_scale = 1.0
# Strength of the controller rumble on a phone's own vibrator (0.0 .. 1.0, 0 =
# off), used while no controller with motors is in use; the game's Vibration
# option turns every rumble on or off. Options > Controls > Phone Vibration.
# phone_vibration = 1.0
# Where each control sits, written by the layout editor (Options > Controls >
# Touch Controls > Edit Layout): <name>:<x>,<y>,<size> joined by ";", names
# stick, action, aim, attack, map, inventory, pause, struggle, camera, dpad, run; x and y are the centre as
# fractions of the screen's safe area (without a notch), size the diameter as a
# fraction of its height. Empty (default) = the default places.
# touch_layout =
# EXPERIMENT: movement relative to the screen in every camera but First Person
# (the Classic fixed cameras and TPS/OTS): the stick pushes Harry in the screen's
# directions and he turns toward them, instead of tank controls (1 = on).
control_2d = 0
# With control_2d: 1 = Harry faces the pressed direction at once, 0 (default) =
# he turns into it.
# control_2d_snap = 0
# Horizontal field of view in first person, in degrees (4:3 basis, 55 .. 110).
# Used only while playing in first person; menus, cutscenes and the other
# cameras keep the original projection. 71.1 (default) is the original angle
# (play projects at H = 224, and 2*atan(160/224) = 71.1 degrees); 90 feels like
# a modern shooter. Console: fov <deg>, fov default.
fps_fov = 71.1
# Where the first-person eye is in Harry's body, in 1/4096 of a metre
# (-20000 .. 20000): x = to the right, y = down (negative = up), z = forward.
# fps_head_x = -29
# fps_head_y = -6836
# fps_head_z = 919
# How far the first-person eye moves back while Harry swings a melee weapon, in
# metres: 0.0 .. 1.0, default 0.5; 0 = it stays.
# fps_melee_swing = 0.5
# Look speed factors of the TPS/OTS/FPS cameras, 1.0 = the default.
